}
.star-twinkle { animation: star-twinkle 3s ease-in-out infinite; will-change: opacity, transform; }

@keyframes float-up {
  0%   { transform: translateY(0) rotate(0deg) scale(0.7); opacity: 0; }

  100% { transform: translateY(-110vh) rotate(360deg) scale(1); opacity: 0; }

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }

app: {path:'src/App.tsx', type:'TSX', code:`import { useEffect, useState, useCallback, useRef } from "react";
import StarField from "./components/StarField";
import FloatingHearts from "./components/FloatingHearts";
import ConfettiBurst from "./components/ConfettiBurst";
import TypewriterText from "./components/TypewriterText";
import ScrollReveal from "./components/ScrollReveal";
import Sparkles from "./components/Sparkles";
import ScrollProgress from "./components/ScrollProgress";
import CursorTrail from "./components/CursorTrail";
import BucketList from "./components/BucketList";

const timeline = [
  { icon: "💫", label: "Day 1",   text: "Two strangers became something more." },
  { icon: "🌙", label: "Day 14",  text: "Late nights talking felt like falling." },
  { icon: "☀️", label: "Day 30",  text: "One month of butterflies that never settled." },
  { icon: "🌸", label: "Day 50",  text: "Half a century of days, all better with you." },
  { icon: "⭐", label: "Day 75",  text: "I stopped counting reasons and just loved you." },
  { icon: "💎", label: "Day 100", text: "Here — and more sure of us than ever." },
];

const reasons = [
  "Your laugh is my favorite sound",
  "You make silence comfortable",
  "You remember the little things",
  "The way you look at me",
  "You believe in me more than I do",
  "Your warmth on cold nights",
  "How you say my name",
  "Your courage when life is hard",
  "The way you hold my hand",
  "You make ordinary days magic",
  "Your kindness to strangers",
  "How you dance when you're happy",
  "The stories you tell",
  "Your patience with my flaws",
  "Waking up to your messages",
  "The way you care for everyone",
  "Your smile when you're sleepy",
  "How you make me want to be better",
  "The sound of your voice",
  "Every single moment with you",
];

export default function App() {
  const [started, setStarted] = useState(false);
  const [showContent, setShowContent] = useState(false);
  const [letterOpen, setLetterOpen] = useState(false);
  const [confetti, setConfetti] = useState(false);
  const [likedReasons, setLikedReasons] = useState<Set<number>>(new Set());
  const [letterRevealed, setLetterRevealed] = useState(false);
  const scrollYRef = useRef(0);

  const handleStart = useCallback(() => {
    setStarted(true);
    setTimeout(() => setShowContent(true), 1200);
  }, []);

  const openLetter = useCallback(() => {
    scrollYRef.current = window.scrollY;
    document.body.classList.add("modal-open");
    document.body.style.top = \`-\${window.scrollY}px\`;
    setLetterOpen(true);
    setConfetti(true);
    setTimeout(() => setConfetti(false), 4500);
    setTimeout(() => setLetterRevealed(true), 600);
  }, []);

  const closeLetter = useCallback(() => {
    setLetterOpen(false);
    setLetterRevealed(false);
    document.body.classList.remove("modal-open");
    document.body.style.top = "";
    window.scrollTo(0, scrollYRef.current);
  }, []);

  const toggleLike = useCallback((index: number) => {
    setLikedReasons((prev) => {
      const next = new Set(prev);
      next.has(index) ? next.delete(index) : next.add(index);
      return next;
    });
  }, []);

  const [elapsed, setElapsed] = useState(() => getElapsed());
  useEffect(() => {
    const id = setInterval(() => setElapsed(getElapsed()), 1000);
    return () => clearInterval(id);
  }, []);

  const [toNext, setToNext] = useState(() => getCountdown(200));
  useEffect(() => {
    const id = setInterval(() => setToNext(getCountdown(200)), 1000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      if (e.key === "Escape" && letterOpen) closeLetter();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [letterOpen, closeLetter]);

  // ... full render JSX (10 sections + letter modal)
  // See full file in the repository
}`},

confetti: {path:'src/components/ConfettiBurst.tsx', type:'TSX', code:`import { useMemo } from "react";

const colors = [
  "#ff5f8f","#ff9a9e","#fecfef","#fbc2eb",
  "#a18cd1","#f6d5f7","#ffdde1","#ee9ca7",
  "#fcb69f","#ffecd2","#f8b500","#ff6b81",
  "#ffd1ff","#c9b1ff","#ffb3c6","#fff1e6",
];

export default function ConfettiBurst({ active }: { active: boolean }) {
  const pieces = useMemo(
    () =>
      Array.from({ length: 120 }, (_, i) => ({
        id: i,
        color: colors[i % colors.length],
        left: \`\${(i * 37 + 11) % 100}%\`,
        delay: \`\${(i % 18) * 0.07}s\`,
        duration: \`\${2.2 + (i % 6) * 0.4}s\`,
        size: 4 + (i % 5) * 3,
        drift: ((i % 21) - 10) * 15,
        shape: i % 3,
      })),
    []
  );

  if (!active) return null;

  return (
    <div className="pointer-events-none fixed inset-0 z-[90] overflow-hidden" aria-hidden="true">
      {pieces.map((p) => (
        <span
          key={p.id}
          className="confetti-piece absolute"
          style={{
            left: p.left,
            top: "-12px",
            animationDelay: p.delay,
            "--confetti-duration": p.duration,
            "--drift": \`\${p.drift}px\`,
            width: \`\${p.size}px\`,
            height: p.shape === 0 ? \`\${p.size}px\` : \`\${p.size * 2.5}px\`,
            backgroundColor: p.color,
            borderRadius: p.shape === 0 ? "50%" : p.shape === 1 ? "2px" : "0",
          } as React.CSSProperties}
        />
      ))}
    </div>
  );
}`},

cursor: {path:'src/components/CursorTrail.tsx', type:'TSX', code:`import { useEffect, useRef, useCallback } from "react";

export default function CursorTrail() {
  const containerRef = useRef<HTMLDivElement>(null);
  const throttleRef = useRef(0);

  const spawn = useCallback((x: number, y: number) => {
    if (!containerRef.current) return;
    const now = Date.now();
    if (now - throttleRef.current < 80) return;
    throttleRef.current = now;

    const el = document.createElement("span");
    el.textContent = "♥";
    el.className = "cursor-trail-heart";
    el.style.cssText = \`position:fixed;left:\${x}px;top:\${y}px;pointer-events:none;font-size:\${10 + Math.random() * 8}px;color:rgba(255,95,143,\${0.3 + Math.random() * 0.3});z-index:109;transition:all 0.8s ease-out;\`;
    containerRef.current.appendChild(el);

    requestAnimationFrame(() => {
      el.style.transform = \`translateY(-\${30 + Math.random() * 40}px) rotate(\${Math.random() * 40 - 20}deg) scale(0)\`;
      el.style.opacity = "0";
    });

    setTimeout(() => el.remove(), 900);
  }, []);

  useEffect(() => {
    const onMove = (e: MouseEvent) => spawn(e.clientX, e.clientY);
    window.addEventListener("mousemove", onMove, { passive: true });
    return () => window.removeEventListener("mousemove", onMove);
  }, [spawn]);

  return (
    <div ref={containerRef} className="pointer-events-none fixed inset-0 z-[109] overflow-hidden" />
  );
}`},

progress: {path:'src/components/ScrollProgress.tsx', type:'TSX', code:`import { useEffect, useState } from "react";

export default function ScrollProgress() {
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (

      <div
        className="h-full bg-gradient-to-r from-rose-500 via-pink-400 to-rose-300 transition-[width] duration-100"
        style={{ width: \`\${progress}%\` }}

reveal: {path:'src/components/ScrollReveal.tsx', type:'TSX', code:`import { useEffect, useRef, type ReactNode } from "react";

export default function ScrollReveal({
  children,
  className = "",
  delay = 0,
}: {
  children: ReactNode;
  className?: string;
  delay?: number;
}) {
  const ref = useRef<HTMLDivElement>(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          el.classList.add("visible");
          observer.unobserve(el);
        }
      },
      { threshold: 0.15, rootMargin: "0px 0px -40px 0px" }
    );

    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  return (
    <div
      ref={ref}
      className={\`reveal \${delay > 0 ? \`reveal-delay-\${Math.min(delay, 5)}\` : ""} \${className}\`}
    >
      {children}
    </div>
  );
}`},

typewriter: {path:'src/components/TypewriterText.tsx', type:'TSX', code:`import { useState, useEffect } from "react";

export default function TypewriterText({
  text,
  delay = 0,
  speed = 40,
  className = "",
  onComplete,
}: {
  text: string;
  delay?: number;
  speed?: number;
  className?: string;
  onComplete?: () => void;
}) {
  const [displayed, setDisplayed] = useState("");
  const [started, setStarted] = useState(false);

  useEffect(() => {
    const timeout = setTimeout(() => setStarted(true), delay);
    return () => clearTimeout(timeout);
  }, [delay]);

  useEffect(() => {
    if (!started) return;
    if (displayed.length < text.length) {
      const timer = setTimeout(() => {
        setDisplayed(text.slice(0, displayed.length + 1));
      }, speed);
      return () => clearTimeout(timer);
    } else if (onComplete) {
      onComplete();
    }
  }, [displayed, started, text, speed, onComplete]);

  return (
    <span className={className}>
      {displayed}
      {displayed.length < text.length && started && (
        <span className="inline-block w-[2px] h-[1em] bg-current ml-0.5 animate-pulse align-middle" />
      )}
    </span>
  );
}`},

bucket: {path:'src/components/BucketList.tsx', type:'TSX', code:`import { useState, useCallback } from "react";

  { text: "Watch every movie on our shared list",     icon: "🎬" },

];

export default function BucketList() {
  const [checked, setChecked] = useState<Set<number>>(new Set());

  const toggle = useCallback((i: number) => {
    setChecked((prev) => {
      const next = new Set(prev);
      next.has(i) ? next.delete(i) : next.add(i);
      return next;
    });
  }, []);

  return (
    <div className="mx-auto mt-10 grid max-w-3xl grid-cols-1 gap-3 sm:mt-14 sm:grid-cols-2">
      {items.map((item, i) => (
        <button
          key={item.text}
          onClick={() => toggle(i)}
          className={\`group flex items-center gap-3 rounded-xl border p-4 text-left
            transition-all duration-500 sm:rounded-2xl sm:p-5 \${
            checked.has(i)
              ? "border-rose-400/30 bg-rose-500/10"
              : "border-white/8 bg-white/[0.03] hover:border-white/15 hover:bg-white/[0.06]"
          }\`}
        >
          <span className={\`flex h-8 w-8 flex-shrink-0 items-center justify-center

            checked.has(i)

};

const badgeClass = {TSX:'badge-tsx', CSS:'badge-css', TS:'badge-ts', HTML:'badge-html'};

function show(key) {
  const f = files[key];
  document.getElementById('fp').textContent = f.path;
  const badge = document.getElementById('badge');
  badge.textContent = f.type;
  badge.className = 'badge ' + (badgeClass[f.type]||'');
  badge.style.display = 'inline-block';

  const lines = f.code.split('\n');
  const html = lines.map((line, i) => {
    const safe = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="line"><span class="ln">${i+1}</span><span>${safe}</span></div>`;
  }).join('');
  document.getElementById('code-area').innerHTML = `<pre>${html}</pre>`;

  const bytes = new TextEncoder().encode(f.code).length;
  document.getElementById('s-lines').textContent = lines.length;
  document.getElementById('s-size').textContent = bytes < 1024 ? bytes + ' B' : (bytes/1024).toFixed(1) + ' KB';
  document.getElementById('s-type').textContent = f.type;
  document.getElementById('stats').style.display = 'flex';

  document.querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.file-btn').forEach(b => {
    if(b.getAttribute('onclick') === `show('${key}')`) b.classList.add('active');
  });
}

show('html');
</script>
